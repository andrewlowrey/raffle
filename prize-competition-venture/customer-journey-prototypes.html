<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Journey Prototypes — Prize Competition Venture</title>
<link rel="stylesheet" href="venture.css">
<style>
  body { background: var(--paper-soft); }

  .proto-wrap { max-width: 1240px; margin: 0 auto; padding: var(--space-xl) var(--space-lg) var(--space-3xl); }

  /* ── Controls ── */
  .proto-controls {
    display: flex; flex-wrap: wrap; gap: var(--space-md);
    align-items: center; justify-content: space-between;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-xl); box-shadow: var(--shadow-sm);
  }
  .journey-tabs { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
  .journey-tab {
    padding: 8px 18px; border-radius: var(--radius-pill); border: 2px solid var(--line);
    background: transparent; cursor: pointer; font-family: var(--font-body);
    font-size: 0.85rem; font-weight: 600; color: var(--muted);
    transition: all var(--t-fast);
  }
  .journey-tab:hover { border-color: var(--accent-line); color: var(--accent); }
  .journey-tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toggle-wrap { display: flex; align-items: center; gap: var(--space-sm); font-size: 0.85rem; }
  .toggle-wrap input { width: 16px; height: 16px; accent-color: var(--accent); }

  .proto-stage { display: grid; grid-template-columns: 420px 1fr; gap: var(--space-xl); align-items: start; }
  @media (max-width: 980px) { .proto-stage { grid-template-columns: 1fr; } }

  /* ── Phone frame ── */
  .phone {
    background: var(--ink); border-radius: 36px; padding: 12px;
    box-shadow: var(--shadow-lg); position: sticky; top: var(--space-lg);
  }
  .phone__notch { height: 22px; display: flex; align-items: center; justify-content: center; }
  .phone__notch span { width: 90px; height: 5px; background: rgba(255,255,255,0.22); border-radius: 100px; }
  .phone__screen {
    background: var(--paper); border-radius: 26px; overflow: hidden;
    height: 720px; display: flex; flex-direction: column; position: relative;
  }

  .app-bar {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--paper);
  }
  .app-bar__back {
    border: none; background: var(--line-soft); width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer; font-size: 0.9rem; line-height: 1; color: var(--ink-soft);
  }
  .app-bar__back[disabled] { opacity: 0.35; cursor: default; }
  .app-bar__title { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  .app-bar__step { margin-left: auto; font-size: 0.7rem; color: var(--faint); }

  .screen { flex: 1; overflow-y: auto; padding: var(--space-md); display: none; }
  .screen.is-active { display: block; }

  /* ── In-app UI ── */
  .p-hero { border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-md); }
  .p-hero__img {
    height: 150px; background: linear-gradient(135deg, #14181D, #34302B 55%, var(--accent));
    display: flex; align-items: flex-end; padding: 12px;
  }
  .p-hero__img--cash { background: linear-gradient(135deg, #10231A, #1B5638 60%, #2C8A5A); }
  .p-hero__img small { color: rgba(255,255,255,0.7); font-size: 0.68rem; }

  .p-badge {
    display: inline-block; padding: 3px 9px; border-radius: var(--radius-pill);
    font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    background: var(--accent); color: #fff; margin: 0 4px 4px 0;
  }
  .p-badge--guar { background: var(--ok); }
  .p-badge--ghost { background: rgba(255,255,255,0.2); }

  .p-title { font-size: 1.05rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; color: var(--ink); }
  .p-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: var(--space-sm); }

  .p-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: var(--space-sm); }
  .p-meta div { background: var(--paper-soft); border-radius: var(--radius-sm); padding: 8px 10px; }
  .p-meta dt { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
  .p-meta dd { font-size: 0.85rem; font-weight: 700; color: var(--ink); }

  .p-progress { height: 6px; background: var(--line); border-radius: 100px; overflow: hidden; margin: 6px 0 4px; }
  .p-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
  .p-progress-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin-bottom: var(--space-sm); }

  .p-btn {
    display: block; width: 100%; text-align: center; padding: 13px;
    border: none; border-radius: var(--radius-md); background: var(--accent);
    color: #fff; font-family: var(--font-body); font-size: 0.9rem; font-weight: 700;
    cursor: pointer; margin-bottom: 8px; transition: background var(--t-fast);
  }
  .p-btn:hover { background: var(--accent-dark); }
  .p-btn--ghost { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  .p-btn--ghost:hover { background: var(--accent-tint); color: var(--accent-dark); }
  .p-btn--dark { background: var(--ink); }
  .p-btn--sm { padding: 9px; font-size: 0.8rem; }

  .p-link { display: block; text-align: center; font-size: 0.78rem; color: var(--accent); text-decoration: underline; cursor: pointer; margin-bottom: 8px; }

  .p-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; }
  .p-card--accent { border-left: 3px solid var(--accent); background: var(--accent-tint); }
  .p-card--ok { border-left: 3px solid var(--ok); background: var(--ok-tint); }
  .p-card--warn { border-left: 3px solid var(--warn); background: var(--warn-tint); }
  .p-card__t { font-size: 0.78rem; font-weight: 700; margin-bottom: 2px; color: var(--ink); }
  .p-card__d { font-size: 0.72rem; color: var(--muted); line-height: 1.45; }

  .p-h { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin: var(--space-md) 0 6px; }

  .p-feed { background: var(--paper-soft); border-radius: var(--radius-md); padding: 8px 10px; margin-bottom: var(--space-sm); }
  .p-feed__row { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; padding: 3px 0; color: var(--ink-soft); }
  .p-feed__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .p-feed__row span:last-child { margin-left: auto; color: var(--faint); font-size: 0.65rem; }

  .p-rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-sm); }
  .p-tile { min-width: 118px; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; cursor: pointer; }
  .p-tile:hover { border-color: var(--accent); }
  .p-tile__img { height: 62px; background: linear-gradient(135deg, #1E2429, var(--accent)); }
  .p-tile__img--b { background: linear-gradient(135deg, #10231A, #2C8A5A); }
  .p-tile__img--c { background: linear-gradient(135deg, #1A1F26, #55606D); }
  .p-tile__b { padding: 6px 8px; }
  .p-tile__t { font-size: 0.68rem; font-weight: 700; line-height: 1.25; color: var(--ink); }
  .p-tile__p { font-size: 0.65rem; color: var(--accent); font-weight: 700; }

  .qty { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--space-sm); }
  .qty button { padding: 12px 4px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--paper); cursor: pointer; font-family: var(--font-body); }
  .qty button:hover { border-color: var(--accent-line); }
  .qty button.is-sel { border-color: var(--accent); background: var(--accent-tint); }
  .qty b { display: block; font-size: 0.95rem; color: var(--ink); }
  .qty small { font-size: 0.62rem; color: var(--muted); }

  .p-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .p-row--total { font-weight: 700; font-size: 0.95rem; border-bottom: none; padding-top: 10px; color: var(--ink); }

  .p-pay { display: flex; gap: 6px; margin-bottom: 8px; }
  .p-pay button { flex: 1; padding: 10px 4px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--paper); font-size: 0.7rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); color: var(--ink-soft); }
  .p-pay button.is-sel { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }
  .p-pay button:disabled { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }

  .p-check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.45; }
  .p-check input { margin-top: 2px; accent-color: var(--accent); }

  .reveal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--space-sm); }
  .reveal-tile {
    aspect-ratio: 1; border-radius: var(--radius-md); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; border: none;
    background: linear-gradient(135deg, var(--ink), var(--accent));
    color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 0.7rem;
    transition: transform var(--t-fast);
  }
  .reveal-tile:hover { transform: scale(1.04); }
  .reveal-tile.is-done { background: var(--paper-soft); color: var(--muted); border: 1px solid var(--line); cursor: default; }
  .reveal-tile.is-win { background: var(--ok-tint); border: 2px solid var(--ok); color: var(--ok); }

  .p-success { text-align: center; padding: var(--space-lg) 0; }
  .p-success__ring {
    width: 62px; height: 62px; border-radius: 50%; margin: 0 auto var(--space-sm);
    background: var(--accent-tint); border: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; color: var(--accent); font-weight: 700;
  }

  /* ── Notes panel ── */
  .notes { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm); }
  .notes__flow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-lg); }
  .notes__crumb {
    padding: 5px 12px; border-radius: var(--radius-pill); font-size: 0.72rem;
    background: var(--paper-soft); color: var(--muted); cursor: pointer;
    border: 1px solid var(--line); font-weight: 600;
  }
  .notes__crumb.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .notes__crumb.is-done { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-line); }
  .notes h3 { font-size: 1.1rem; margin-bottom: 4px; }
  .notes .lede { font-size: 0.88rem; color: var(--muted); margin-bottom: var(--space-md); }
  .note-item { border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .note-item--risk { border-left-color: var(--warn); background: var(--warn-tint); }
  .note-item--legal { border-left-color: var(--risk); background: var(--risk-tint); }
  .note-item__tag { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin-bottom: 3px; }
  .note-item--risk .note-item__tag { color: var(--warn); }
  .note-item--legal .note-item__tag { color: var(--risk); }
  .note-item__body { font-size: 0.8rem; line-height: 1.5; color: var(--ink-soft); }
  .notes.is-hidden .note-item, .notes.is-hidden .notes__legend { display: none; }
  .notes__legend { font-size: 0.72rem; color: var(--muted); margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__content">
      <div class="site-header__title">Customer Journey Prototypes</div>
      <div class="site-header__subtitle">Prize Competition Venture &mdash; clickable walkthrough &middot; supports Business Case v0.4</div>
    </div>
    <div class="site-header__action">
      <a class="btn btn--secondary" href="index.html" style="color:#fff;border-color:rgba(255,255,255,.5)">&larr; Business case</a>
    </div>
  </div>
</header>

<div class="proto-wrap">

  <div class="proto-controls">
    <div class="journey-tabs">
      <button class="journey-tab is-active" data-journey="paid">A &middot; Paid entry</button>
      <button class="journey-tab" data-journey="free">B &middot; Free entry route</button>
      <button class="journey-tab" data-journey="instant">C &middot; Instant win + reveal</button>
    </div>
    <label class="toggle-wrap">
      <input type="checkbox" id="notesToggle" checked>
      <span>Show compliance &amp; design notes</span>
    </label>
  </div>

  <div class="proto-stage">

    <div class="phone">
      <div class="phone__notch"><span></span></div>
      <div class="phone__screen">
        <div class="app-bar">
          <button class="app-bar__back" id="backBtn" disabled>&#8592;</button>
          <div class="app-bar__title" id="barTitle">Home</div>
          <div class="app-bar__step" id="barStep">1 / 5</div>
        </div>
        <div id="screens"></div>
      </div>
    </div>

    <div class="notes" id="notesPanel">
      <div class="notes__flow" id="flow"></div>
      <h3 id="noteTitle">Screen</h3>
      <p class="lede" id="noteLede"></p>
      <div id="noteList"></div>
      <div class="notes__legend">
        <strong>Copper</strong> design intent &middot; <strong>Amber</strong> commercial risk &middot; <strong>Red</strong> legal requirement.
        Prototype only &mdash; illustrative content, no real data, no payment processing.
      </div>
    </div>

  </div>
</div>

<script src="customer-journey-prototypes.js"></script>
</body>
</html>
